<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio</title>
    <!-- Vinculando o arquivo CSS externo -->
    <link rel="stylesheet" href="estilos/style.css">
    <style>
        /* Estilos básicos de estrutura geral do portfólio */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: white;
            padding: 40px 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        section.coluna {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- As colunas que vão receber a animação e a responsividade -->
        <section class="coluna">
            <h2>Projeto 1</h2>
            <p>Descrição do seu primeiro projeto do portfólio.</p>
        </section>

        <section class="coluna">
            <h2>Projeto 2</h2>
            <p>Descrição do seu segundo projeto do portfólio.</p>
        </section>

        <section class="coluna">
            <h2>Projeto 3</h2>
            <p>Descrição do seu terceiro projeto do portfólio.</p>
        </section>

        <section class="coluna">
            <h2>Projeto 4</h2>
            <p>Descrição do seu quarto projeto do portfólio.</p>
        </section>
    </main>

</body>
</html>
